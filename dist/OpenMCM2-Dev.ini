; OpenMCM2 dev build settings. Each switch is 0 (off) or 1 (on); a missing one is off.

[trace]
; to openmcm2-dev.log in the game folder
screens=1
events=0
files=0
display=0

[menus]
; the menus at the races' resolution, scaled evenly and centred (experimental)
widescreen=0
; the 640x480 menus' side bars filled with a blurred, darkened copy of them
fill_sides=1
; the modern menus: widescreen, with the layouts in ui\modern\ where there are any
modern=0

[fixes]
; the computer riders' random picks can land on the last bike or rider
last_pick=0
