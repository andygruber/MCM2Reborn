; MCM2:Reborn's settings. The game's options screen sets most of these itself (its REBORN and
; GAMEPAD pages); a missing switch is off.

[menus]
; the modern menus, at the screen's resolution
modern=1
widescreen=1
fill_sides=1
; the main menu over your newest recorded replay (first version)
live_background=0

[graphics]
vsync=1
antialiasing=4
filtering=4
frame_limit=0
fxaa=1
sharpen=25
vibrance=0
brightness=100

[reborn]
hud=1
cameras=1
physics=1
riders=30

[fixes]
last_pick=1
; the computer riders take 30 steps a second, whatever the frame rate (0: one a frame, as the game did)
ai_rate=30

[gamepad]
xinput=1
response=15
deadzone=15
lean_stick=0
directinput_pads_analog=1

[online]
; counted as playing while the game runs, for the launcher's count of riders online
presence=1
